# ROS 2 node name: odroid_driver
odroid_driver:
  ros__parameters:
    # uart_hoverboard = CH341 + старый бинарный протокол; socketcan_odrive = ODrive после slcan (can0/can1).
    transport: "socketcan_odrive"
    # Шины: start_can.sh поднимает /dev/can_front (адаптер 208C33725931) как can0 и
    # /dev/can_rear (адаптер 206932AA5052) как can1. CAN-провод переднего ODrive должен идти
    # в адаптер can_front, заднего — в can_rear; от USB-порта ничего не зависит.
    # В параметрах ниже только имена из ip link (can0/can1), не пути /dev/...
    # Передняя ось (FL/FR).
    can_interface: "can0"
    # Задняя ось (RL/RR). Если все четыре оси на одной шине — поставьте "" и задайте четыре
    # уникальных axis id на этой шине (например 0–3).
    can_interface_rear: "can1"
    can_bitrate: 250000
    # Раскладка (по одному ODrive на ось, node id 0 и 1 на каждой шине):
    #   передний ODrive, can0: axis0 = FL, axis1 = FR
    #   задний ODrive,   can1: axis0 = RR, axis1 = RL
    # Проверка: сервис test_wheel крутит FL — должно закрутиться переднее левое колесо вперёд.
    axis_id_fl: 0
    axis_id_fr: 1
    axis_id_rl: 1
    axis_id_rr: 0

    # Знак +velocity в ODrive должен совпадать с «вперёд» робота для каждого колеса.
    # Если при чистом vx перед и зад крутятся навстречу — выключите инверсию задней оси или
    # включите на передней (подбирайте по месту).
    can_invert_fl: false
    can_invert_fr: false
    can_invert_rl: false
    can_invert_rr: false
    torque_ff: 0.0

    front_serial: "0001"
    rear_serial: "0002"
    baudrate: 115200
    timeout: 0.05
    wheel_radius: 0.095
    # Обороты мотора на оборот колеса (редукторные мотор-колёса DDK). 1 — драйвер шлёт
    # ODrive обороты колеса как обороты мотора, и робот едет в ~5 раз медленнее команды.
    # Поднимать вместе со шкалами пульта: иначе джойстик станет в столько же раз быстрее.
    gear_ratio: 1.0
    wheel_base: 0.635
    wheel_track: 0.72
    max_speed: 100
    # Для CAN test_wheel: целевая скорость FL в об/с (turns/s). Для UART — масштаб как раньше.
    test_speed: 3.0
    simulation_mode: false
    cmd_vel_subscribe_stamped: false
    # Колёса стоят зеркально: оси роликов, касающихся пола, смотрят в центр робота (снизу — буква X).
    # Стрейф от этого меняет знак, а поворот идёт за счёт проскальзывания роликов (скрип, нужен yaw_gain).
    # Если переставить колёса в стандартную схему — поставить "X".
    roller_layout: "O"
    # Множитель wz внутри кинематики. 10 сохраняет прежнее поведение пульта и навигации;
    # подобрать замером поворота на месте (заказали N рад/с — получили N).
    yaw_gain: 10.0
    # Нет cmd_vel дольше этого (с) — колёса в ноль.
    cmd_vel_timeout: 0.3
    # 0 = без ограничения. Круг от позы включения — только профиль calibrate
    # (odroid_driver_calibrate.yaml, docker compose --profile calibrate).
    max_linear_mps: 0.0
    max_angular_rps: 0.0
    max_wheel_turns_s: 0.0
    # Плавный разгон и торможение команды (0 = без ограничения). Аварийный стоп идёт
    # мимо: оси сразу уходят в IDLE. Единицы командные: пока gear_ratio = 1, робот
    # реально разгоняется примерно в столько раз медленнее, во сколько не учтён редуктор.
    max_linear_accel_mps2: 1.5
    max_angular_accel_rps2: 5.0
    # Торможение (скорость падает по модулю или меняет знак) — резче разгона.
    max_linear_decel_mps2: 6.0
    max_angular_decel_rps2: 20.0
    travel_radius_limit_m: 0.0
    yaw_travel_limit_rad: 0.0
    # Пробел в любом окне снимает момент. Сторож должен быть жив, иначе колёса не едут.
    require_safety_watchdog: true
