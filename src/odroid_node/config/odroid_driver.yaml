# ROS 2 node name: odroid_driver
odroid_driver:
  ros__parameters:
    # uart_hoverboard = CH341 + старый бинарный протокол; socketcan_odrive = ODrive после slcan (can0/can1).
    transport: "socketcan_odrive"
    # Шины: start_can.sh поднимает /dev/can_front как can0 и /dev/can_rear как can1, но адаптеры
    # подключены наоборот: can0 физически идёт на ЗАДНИЙ ODrive, can1 на ПЕРЕДНИЙ.
    # В параметрах ниже только имена из ip link (can0/can1), не пути /dev/...
    # Передняя ось (FL/FR).
    can_interface: "can1"
    # Задняя ось (RL/RR). Если все четыре оси на одной шине — поставьте "" и задайте четыре
    # уникальных axis id на этой шине (например 0–3).
    can_interface_rear: "can0"
    can_bitrate: 250000
    # Раскладка (по одному ODrive на ось, node id 0 и 1 на каждой шине):
    #   передний ODrive, can1: axis0 = FR, axis1 = FL
    #   задний ODrive,   can0: axis0 = RL, axis1 = RR
    # Выведено из поведения пульта, замеров знака wz навигацией и X-схемы роликов.
    # Проверка: сервис test_wheel крутит FL — должно закрутиться переднее левое колесо вперёд.
    axis_id_fl: 1
    axis_id_fr: 0
    axis_id_rl: 0
    axis_id_rr: 1

    # Знак +velocity в ODrive должен совпадать с «вперёд» робота для каждого колеса.
    # Если при чистом vx перед и зад крутятся навстречу — выключите инверсию задней оси или
    # включите на передней (подбирайте по месту).
    can_invert_fl: false
    can_invert_fr: false
    can_invert_rl: false
    can_invert_rr: false
    torque_ff: 0.0

    front_serial: "0001"
    rear_serial: "0002"
    baudrate: 115200
    timeout: 0.05
    wheel_radius: 0.095
    wheel_base: 0.635
    wheel_track: 0.72
    max_speed: 100
    # Для CAN test_wheel: целевая скорость FL в об/с (turns/s). Для UART — масштаб как раньше.
    test_speed: 3.0
    simulation_mode: false
    cmd_vel_subscribe_stamped: false
    # Множитель wz внутри кинематики. 10 сохраняет прежнее поведение пульта и навигации;
    # подобрать замером поворота на месте (заказали N рад/с — получили N).
    yaw_gain: 10.0
    # Нет cmd_vel дольше этого (с) — колёса в ноль.
    cmd_vel_timeout: 0.3
