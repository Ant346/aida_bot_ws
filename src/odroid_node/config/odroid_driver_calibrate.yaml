# Профиль calibrate. Подключается поверх odroid_driver.yaml, когда
# ODRIVE_CALIBRATE=true (сервис odroid_calibrate в compose.yaml).
# Ноль отсчёта — поза в момент включения драйвера. Наружу дальше предела
# команда обнуляется, возврат к этой точке проходит.
odroid_driver:
  ros__parameters:
    # 0.05 м/с не срывает колёса с трения роликов.
    max_linear_mps: 0.5
    max_angular_rps: 2.0
    # Поворот у O-роликов начинается только после срыва трения. 0.8 об/с
    # не хватает момента на старте: помогаешь рукой — дальше едет легко.
    max_wheel_turns_s: 2.0
    travel_radius_limit_m: 2.0
    # 0 = поворот не режется. Ход ограничен кругом 2 м.
    yaw_travel_limit_rad: 0.0
