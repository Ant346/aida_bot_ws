services:
  ds4driver:
    build:
      context: ./docker_ros
      dockerfile: dockerfile
    volumes:
      - ./ds4_driver_submodule:/workspace/ds4_driver_submodule
      - ./docker_ros/ds4_twist:/workspace/ds4_twist_config:ro
      - ./src:/workspace/src
      - ./build:/workspace/build
      - ./install:/workspace/install
      - /dev:/dev
    environment:
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "0"
      # Do not pull realsense2_camera into this service (slow / large); build only DS4.
      COLCON_PACKAGES_SELECT: "ds4_driver_msgs ds4_driver"
    entrypoint: ["/entrypoint.bash"]
    command:
      ["ros2", "launch", "/workspace/ds4_twist_config/ds4_twist_aida.launch.xml"]
    privileged: true
    network_mode: host

  # Обычный драйвер: без предела хода.
  # Калибровка (не дальше 15 см от позы включения):
  #   docker compose stop odroid_node
  #   docker compose --profile calibrate up -d odroid_calibrate
  # Обратно: stop odroid_calibrate && docker compose up -d odroid_node
  # Оба сразу не запускать — один и тот же CAN.
  odroid_node: &odroid_node
    build:
      context: ./docker_ros
      dockerfile: dockerfile
    volumes:
      - ./rosbag_05_05:/workspace/rosbag_05_05
      - ./ds4_driver_submodule:/workspace/ds4_driver_submodule
      - ./src:/workspace/src
      - ./build:/workspace/build
      - ./install:/workspace/install
      - /dev:/dev
    environment: &odroid_env
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "0"
      COLCON_PACKAGES_SELECT: "odroid_node"
      # --- Опциональные оверрайды CAN для launch'а одроида ---
      # Если задняя CAN-шина мертва (нет адаптера, нет порта на ноуте, и т.п.) —
      # подними так: `ROBOT_SINGLE_CAN=true docker compose up odroid_node`.
      # Узел тогда:
      #   - не открывает can_interface_rear (передняя становится единственной),
      #   - задаёт axis_id_rl/rr = -1 (задние моторы не получают команд).
      # Перед стартом всё равно нужно `sudo odroid_v_3.6/start_can.sh` — он сам
      # пропустит отсутствующий /dev/can_front или /dev/can_rear (warning, не error).
      ROBOT_SINGLE_CAN: "${ROBOT_SINGLE_CAN:-false}"
      CAN_INTERFACE: "${CAN_INTERFACE:-}"
      CAN_INTERFACE_REAR: "${CAN_INTERFACE_REAR:-}"
      ODRIVE_CALIBRATE: "false"
    entrypoint: ["/entrypoint.bash"]
    # Параметры CAN / UART в src/odroid_node/config/odroid_driver.yaml (transport, can_interface, axis_id_*).
    command: ["ros2", "launch", "odroid_node", "odroid_driver.launch.py"]
    privileged: true
    network_mode: host
    depends_on:
      - ds4driver

  odroid_calibrate:
    <<: *odroid_node
    profiles: ["calibrate"]
    environment:
      <<: *odroid_env
      ODRIVE_CALIBRATE: "true"

  # Legacy CH341 + hoverboard_driver (НЕ CAN). Не поднимать вместе с odroid_node:
  #   docker compose --profile hoverboard_serial up hoverboard_node
  hoverboard_node:
    profiles: ["hoverboard_serial"]
    build:
      context: ./hoverboard_node
      dockerfile: dockerfile
    volumes:
      - ./hoverboard_node:/workspace
      - /dev:/dev
    environment:
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "0"
      HOVERBOARD_SIMULATION: "${HOVERBOARD_SIMULATION:-false}"
    entrypoint: ["/entrypoint.bash"]
    command:
      [
        "ros2",
        "launch",
        "hoverboard_node",
        "hoverboard_driver.launch.py",
        "simulation_mode:=${HOVERBOARD_SIMULATION:-false}",
      ]
    privileged: true
    network_mode: host

  realsense:
    build:
      context: ./docker_ros
      dockerfile: dockerfile
    volumes:
      - ./ds4_driver_submodule:/workspace/ds4_driver_submodule
      - ./src:/workspace/src
      - ./build:/workspace/build
      - ./install:/workspace/install
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      # So container hostname matches Xauth entries for DISPLAY=:0 (see docker_ros/entrypoint.bash).
      - /etc/hostname:/run/host-etc-hostname:ro
      # Wayland/GDM often puts cookies in $XAUTHORITY under /run/user/... not ~/.Xauthority.
      - ${XAUTHORITY_HOST:-${XAUTHORITY:-${HOME}/.Xauthority}}:/root/.Xauthority:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/host-user-runtime:ro
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
      # Сборка по умолчанию в entrypoint: sequential + 1 поток (низкий пик RAM).
      # Если много ядер и RAM: COLCON_EXECUTOR=parallel COLCON_PARALLEL_WORKERS=2 CMAKE_BUILD_PARALLEL_LEVEL=3
      # Значение ниже можно оставить :0 или из echo $DISPLAY; entrypoint переопределит по socket + .Xauthority.
      - DISPLAY=${DISPLAY:-:0}
      # Writable merge of host /root/.Xauthority; same path for PID1 and docker compose exec.
      - XAUTHORITY=/tmp/.x11-docker-authority
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
    entrypoint: ["/entrypoint.bash"]
    command:
      ["ros2", "launch", "realsense_bringup", "d435_default.launch.py"]
    privileged: true
    network_mode: host
    ipc: host

  # D405 is a separate container so it does not open the D435. Topics: /d405/d405/...
  # This camera is on USB 2.0; default stream is 848x480x15. USB 3: REALSENSE_D405_DEPTH_PROFILE=848x480x30
  realsense_d405:
    build:
      context: ./docker_ros
      dockerfile: dockerfile
    volumes:
      - ./ds4_driver_submodule:/workspace/ds4_driver_submodule
      - ./src:/workspace/src
      - ./build:/workspace/build
      - ./install:/workspace/install
      - /dev:/dev
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - COLCON_PACKAGES_SELECT=realsense2_camera_msgs realsense2_camera realsense2_description realsense_bringup
      - REALSENSE_D405_SERIAL=${REALSENSE_D405_SERIAL:-218622278337}
      - REALSENSE_D405_DEPTH_PROFILE=${REALSENSE_D405_DEPTH_PROFILE:-848x480x15}
    entrypoint: ["/entrypoint.bash"]
    command:
      ["ros2", "launch", "realsense_bringup", "d405_default.launch.py"]
    privileged: true
    network_mode: host
    ipc: host

  # ZED-M side-by-side UVC image. zed-ros2-wrapper is not used here: it needs
  # CUDA and an nvidia runtime, and this host has neither.
  zedm:
    build:
      context: ./docker_ros/zedm
      dockerfile: Dockerfile
    image: aida-zedm:humble
    volumes:
      - /dev:/dev
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # 2560x720 rgb8 is about 5.5 MB. Default Fast DDS buffers reject it and
      # the node spams "sequence size exceeds remaining buffer".
      - FASTDDS_BUILTIN_TRANSPORTS=LARGE_DATA
    # Suspended ZED-M returns EBUSY on open and then drops off the bus.
    command:
      - bash
      - -c
      - |
        for d in /sys/bus/usb/devices/*; do
          [[ -f "$$d/idVendor" ]] || continue
          if [[ "$$(cat "$$d/idVendor")" == "2b03" && "$$(cat "$$d/idProduct")" == "f682" ]]; then
            echo on > "$$d/power/control" || true
          fi
        done
        exec ros2 run v4l2_camera v4l2_camera_node --ros-args \
          -r __ns:=/zedm -r __node:=zedm_camera \
          -p video_device:=${ZEDM_VIDEO_DEVICE:-/dev/v4l/by-id/usb-Technologies__Inc._ZED-M-video-index0} \
          -p pixel_format:=YUYV \
          -p image_size:=[${ZEDM_IMAGE_WIDTH:-2560},${ZEDM_IMAGE_HEIGHT:-720}] \
          -p camera_frame_id:=zedm_camera_optical_frame
    privileged: true
    network_mode: host

  rviz:
    profiles: ["viz"]
    build:
      context: ./docker_ros
      dockerfile: dockerfile
    volumes:
      - ./ds4_driver_submodule:/workspace/ds4_driver_submodule
      - ./src:/workspace/src
      - ./build:/workspace/build
      - ./install:/workspace/install
      - ./docker_ros/rviz:/workspace/rviz_configs:ro
      - ./docker_ros/entrypoint-x11.bash:/entrypoint-x11.bash:ro
      - ./agro_cad/agrobot_description:/opt/agrobot_description:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/hostname:/run/host-etc-hostname:ro
      - ${XAUTHORITY_HOST:-${XAUTHORITY:-${HOME}/.Xauthority}}:/root/.Xauthority:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/host-user-runtime:ro
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # Match realsense: empty host DISPLAY breaks x11 discovery; default :0 for local sessions.
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.x11-docker-authority
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - LIBGL_ALWAYS_SOFTWARE=1
      - FASTDDS_BUILTIN_TRANSPORTS=LARGE_DATA
      - GALLIUM_DRIVER=llvmpipe
    network_mode: host
    ipc: host
    entrypoint: ["/entrypoint_rviz.bash"]
    command: ["ros2", "launch", "/workspace/rviz_configs/agrobot.launch.py"]
