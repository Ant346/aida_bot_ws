# Совпадает с ~/.tmux.conf пользователя aida (хост). Меняйте оба или один файл и копируйте.
#
# Префикс Ctrl+b
set -g prefix C-b
unbind C-b
bind C-b send-prefix

set -g history-limit 50000
set -g mouse on

# Выделение → буфер обмена: OSC 52 + wl-copy/xclip (на хосте: apt install wl-clipboard и/или xclip)
set -s set-clipboard external
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard"
bind-key -T copy-mode-emacs MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard"

set -g status-keys emacs
setw -g mode-keys emacs

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -s escape-time 50
setw -g aggressive-resize on

set -g status-interval 5
set -g status-style 'bg=#333333,fg=#eeeeee'
set -g status-left-length 40
set -g status-left '[#S] '
set -g status-right ' %Y-%m-%d %H:%M '
setw -g window-status-current-style 'bg=#569cd6,fg=#000000'

set -ga terminal-overrides ",xterm-256color:Tc"
